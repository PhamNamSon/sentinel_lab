replicaCount: 1

image:
  repository: ghcr.io/phamnamson/sentinel
  pullPolicy: IfNotPresent
  tag: "0.1.6"

container:
  port: 8080

service:
  type: ClusterIP
  port: 80

database:
  url: "jdbc:oracle:thin:@//oracle:1521/FREEPDB1"
  username: "sentinel_app"

secret:
  name: oracle-credentials

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

probes:
  startup:
    path: /actuator/health/liveness
    periodSeconds: 5
    failureThreshold: 60
    timeoutSeconds: 3

  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10

  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5

opentelemetry:
  enabled: true

  serviceName: sentinel

  endpoint: "http://alloy.logging.svc.cluster.local:4318"
  protocol: "http/protobuf"

  tracesExporter: "otlp"
  metricsExporter: "none"
  logsExporter: "none"

  sampler: "parentbased_traceidratio"
  samplingRatio: "1.0"
