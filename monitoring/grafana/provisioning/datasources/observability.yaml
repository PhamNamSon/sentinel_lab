apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"\s*:\s*"([a-fA-F0-9]{32})"'
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View Trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags: []
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{k8s_namespace_name="sentinel"} | json | trace_id="$${__trace.traceId}"'
