apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}

spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "sentinel.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP

          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.database.url | quote }}

            - name: DB_USERNAME
              value: {{ .Values.database.username | quote }}

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: app-user-password
                
            {{- if .Values.opentelemetry.enabled }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/opentelemetry-javaagent.jar"

            - name: OTEL_SERVICE_NAME
              value: {{ .Values.opentelemetry.serviceName | quote }}

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.endpoint | quote }}

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.opentelemetry.protocol | quote }}

            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.opentelemetry.tracesExporter | quote }}

            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.opentelemetry.metricsExporter | quote }}

            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.opentelemetry.logsExporter | quote }}

            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.opentelemetry.sampler | quote }}

            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.opentelemetry.samplingRatio | quote }}
            {{- end }}


          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}