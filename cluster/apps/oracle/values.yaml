image:
  repository: gvenzl/oracle-free
  tag: "23.26.3"
  pullPolicy: IfNotPresent

oracle:
  appUser: sentinel_app

secret:
  name: oracle-credentials

container:
  port: 1521

service:
  type: ClusterIP
  port: 1521

storage:
  size: "5Gi"

resources:
  requests:
    cpu: "250m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "3Gi"
