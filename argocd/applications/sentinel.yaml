apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sentinel
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/phamnamson/sentinel_lab.git
    targetRevision: main
    path: deploy/kubernetes/sentinel

  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: sentinel
      namespace: sentinel
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
