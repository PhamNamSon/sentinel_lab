apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: sentinel-alerts
  namespace: sentinel
  labels:
    release: monitoring

spec:
  groups:
    - name: sentinel.rules
      rules:
        - alert: SentinelAPIDown
          expr: up{namespace="sentinel", service="sentinel"} == 0
          for: 2m

          labels:
            severity: critical

          annotations:
            summary: "Sentinel API is unavailable"
            description: "Prometheus has been unable to scrape the Sentinel API for more than 2 minutes."