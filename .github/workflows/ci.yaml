name: Sentinel CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    test:
        name: Test Application
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: app/target-api

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven

            - name: Start Oracle
              run: |
                  docker run -d \
                  --name oracle \
                  -p 1521:1521 \
                  -e ORACLE_PASSWORD=ci_oracle_password \
                  -e APP_USER=sentinel_app \
                  -e APP_USER_PASSWORD=ci_app_password \
                  gvenzl/oracle-free:23.26.3

            - name: Wait for Oracle
              run: |
                  until docker exec oracle healthcheck.sh; do
                  echo "Waiting for Oracle..."
                  sleep 10
                  done

            - name: Run tests
              env:
                  SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
                  SPRING_DATASOURCE_USERNAME: sentinel_app
                  SPRING_DATASOURCE_PASSWORD: ci_app_password
              run: ./mvnw test

    helm:
        name: Validate Helm Charts
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Helm
              uses: azure/setup-helm@v4

            - name: Lint Sentinel chart
              run: helm lint deploy/kubernetes/sentinel

            - name: Render Sentinel chart
              run: helm template sentinel deploy/kubernetes/sentinel

            - name: Lint Oracle chart
              run: helm lint deploy/kubernetes/oracle

            - name: Render Oracle chart
              run: helm template oracle deploy/kubernetes/oracle
