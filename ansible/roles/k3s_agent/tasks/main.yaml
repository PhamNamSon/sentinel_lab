---
- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: "0755"

- name: Read K3s node token from control plane
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  delegate_to: control-plane
  become: true
  run_once: true

- name: Install K3s agent
  ansible.builtin.command:
    cmd: /tmp/install-k3s.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ hostvars['control-plane']['ansible_host'] }}:6443"
    K3S_TOKEN: "{{ k3s_token['content'] | b64decode | trim }}"
  no_log: true

- name: Wait for worker to become Ready
  ansible.builtin.command:
    cmd: >
      k3s kubectl get node {{ inventory_hostname }}
      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: worker_ready
  until: worker_ready.stdout == "True"
  retries: 30
  delay: 5
  changed_when: false
  delegate_to: control-plane
