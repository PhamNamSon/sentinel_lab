controller:
  type: daemonset

alloy:
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP

    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  mounts:
    varlog: true

  configMap:
    create: true
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.cri {}
        forward_to = [otelcol.receiver.loki.default.receiver]
      }

      otelcol.receiver.loki "default" {
        output {
          logs = [otelcol.processor.transform.logs.input]
        }
      }

      otelcol.processor.transform "logs" {
        error_mode = "ignore"

        log_statements {
          context = "log"
          statements = [
            `set(resource.attributes["k8s.namespace.name"], attributes["namespace"])`,
            `set(resource.attributes["k8s.pod.name"], attributes["pod"])`,
            `set(resource.attributes["k8s.container.name"], attributes["container"])`,
            `set(resource.attributes["service.name"], attributes["container"])`,
          ]
        }

        output {
          logs = [otelcol.processor.batch.logs.input]
        }
      }

      otelcol.processor.batch "logs" {
        output {
          logs = [otelcol.exporter.otlp.gateway.input]
        }
      }

      otelcol.exporter.otlp "gateway" {
        client {
          endpoint = "100.90.165.108:4317"

          tls {
            insecure = true
          }
        }
      }

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
