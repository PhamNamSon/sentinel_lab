apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sentinel
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/phamnamson/sentinel_lab.git
    targetRevision: main
    path: deploy/kubernetes/sentinel

  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
