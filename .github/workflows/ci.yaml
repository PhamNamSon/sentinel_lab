name: Sentinel CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-test:
    name: Test Application
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: app/target-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start Oracle
        run: |
          docker run -d \
          --name oracle \
          -p 1521:1521 \
          -e ORACLE_PASSWORD=ci_oracle_password \
          -e APP_USER=sentinel_app \
          -e APP_USER_PASSWORD=ci_app_password \
          gvenzl/oracle-free:23.26.3

      - name: Wait for Oracle
        run: |
          until docker exec oracle healthcheck.sh; do
          echo "Waiting for Oracle..."
          sleep 10
          done

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          SPRING_DATASOURCE_USERNAME: sentinel_app
          SPRING_DATASOURCE_PASSWORD: ci_app_password
        run: ./mvnw test

  helm-validation:
    name: Validate Helm Charts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Sentinel chart
        run: helm lint deploy/kubernetes/sentinel

      - name: Render Sentinel chart
        run: helm template sentinel deploy/kubernetes/sentinel

      - name: Lint Oracle chart
        run: helm lint deploy/kubernetes/oracle

      - name: Render Oracle chart
        run: helm template oracle deploy/kubernetes/oracle

  publish:
    name: Build and Push Image
    runs-on: ubuntu-24.04

    needs:
      - application-test
      - helm-validation

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app/target-api
          push: true
          tags: ghcr.io/phamnamson/sentinel:${{ steps.version.outputs.version }}
